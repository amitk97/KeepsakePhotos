# Render blueprint: Render → New → Blueprint → pick this repo.
services:
  - type: web
    name: keepsakephotos
    runtime: node
    plan: free # switch to "starter" for the wedding day so it never sleeps
    buildCommand: "true"
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "true"
      - key: IMAGE_PROVIDERS
        value: cloudflare,flux # tried in order; then the free Hugging Face artists from the phone
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false # from Cloudflare dashboard
      - key: CLOUDFLARE_API_TOKEN
        sync: false # Workers AI token
      - key: DAILY_PORTRAIT_CAP
        value: "600"
      - key: STUDIO_OPEN
        value: "true"
      - key: UPSCALE_ENDPOINT_URL
        sync: false # optional: Modal upscale endpoint
      - key: SETTINGS_ENDPOINT_URL
        sync: false # Modal settings store: keeps admin-page changes permanently
      - key: ADMIN_PASSWORD
        sync: false # your admin page password (/admin)
      # Google Drive uploads: leave these empty until you connect Drive; GOOGLE_DRIVE_FOLDER_ID stays empty (SETUP.md)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: FLUX_ENDPOINT_URL
        sync: false # paste from Modal
      - key: FLUX_API_TOKEN
        sync: false # same value as the Modal secret
