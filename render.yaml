# Render blueprint: Render → New → Blueprint → pick this repo.
services:
  - type: web
    name: keepsakephotos
    runtime: node
    plan: free # switch to "starter" for the wedding day so it never sleeps
    buildCommand: "true"
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "true"
      - key: IMAGE_PROVIDER
        value: flux
      - key: FLUX_ENDPOINT_URL
        sync: false # paste from Modal
      - key: FLUX_API_TOKEN
        sync: false # same value as the Modal secret
      - key: GEMINI_API_KEY
        sync: false # optional backup; leave blank to skip
      - key: IMAGE_FALLBACK
        value: gemini # only used if GEMINI_API_KEY is set
