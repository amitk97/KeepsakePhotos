<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" font-family="Helvetica, Arial, sans-serif">
  <title>Keepsake frame template: design your border around the dashed areas, keep them transparent</title>
  <rect width="1200" height="1800" fill="#FAF6EE"/>
  <!-- Border area: decorate freely -->
  <rect x="0" y="0" width="1200" height="1800" fill="none" stroke="#B89B62" stroke-width="120" opacity="0.18"/>
  <text x="600" y="38" text-anchor="middle" font-size="20" fill="#8a7344">BORDER AREA: decorate freely</text>

  <!-- Header text -->
  <rect x="140" y="60" width="920" height="130" fill="none" stroke="#1D3B2D" stroke-dasharray="10 8" stroke-width="3"/>
  <text x="600" y="120" text-anchor="middle" font-size="44" font-weight="bold" fill="#1D3B2D">Pooja &amp; Amit</text>
  <text x="600" y="155" text-anchor="middle" font-size="18" fill="#B89B62">APRIL 2028</text>
  <text x="1050" y="82" text-anchor="end" font-size="14" fill="#c0392b">keep clear: names</text>

  <!-- Message bubble -->
  <rect x="140" y="210" width="920" height="194" rx="20" fill="none" stroke="#1D3B2D" stroke-dasharray="10 8" stroke-width="3"/>
  <text x="600" y="305" text-anchor="middle" font-size="30" font-style="italic" fill="#1D3B2D">“Guest's message”</text>
  <text x="1050" y="232" text-anchor="end" font-size="14" fill="#c0392b">keep transparent: message bubble</text>

  <!-- Painting window -->
  <rect x="192" y="442" width="816" height="1088" rx="16" fill="#e9e1cf" stroke="#c0392b" stroke-dasharray="14 10" stroke-width="4"/>
  <text x="600" y="970" text-anchor="middle" font-size="40" font-weight="bold" fill="#c0392b">PAINTING WINDOW</text>
  <text x="600" y="1020" text-anchor="middle" font-size="24" fill="#c0392b">x 192, y 442, 816 × 1088 px</text>
  <text x="600" y="1056" text-anchor="middle" font-size="24" fill="#c0392b">keep fully transparent</text>

  <!-- Guest name -->
  <rect x="140" y="1560" width="920" height="120" fill="none" stroke="#1D3B2D" stroke-dasharray="10 8" stroke-width="3"/>
  <text x="600" y="1617" text-anchor="middle" font-size="36" font-weight="bold" fill="#1D3B2D">Illustrated for Guest Name</text>
  <text x="600" y="1659" text-anchor="middle" font-size="16" fill="#B89B62">WITH LOVE &amp; CELEBRATION  •  POOJA &amp; AMIT</text>

  <!-- Monogram -->
  <rect x="572" y="1678" width="56" height="56" fill="none" stroke="#1D3B2D" stroke-dasharray="6 5" stroke-width="2"/>
  <text x="640" y="1712" font-size="14" fill="#c0392b">monogram</text>
</svg>
